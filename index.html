<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>デザインマネージャー</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="appRoot" class="desktop-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-icon">✦</div>
        <div>
          <div class="brand-title">デザインマネージャー</div>
          <div class="brand-sub">クリエイティブ管理</div>
        </div>
      </div>
      <nav id="sideNav"></nav>
      <div class="version">デザインマネージャー 公開版 v1.0</div>
    </aside>

    <div class="main-wrap">
      <header class="topbar" id="topbar"></header>
      <div id="mobileNav" class="mobile-nav hidden"></div>
      <main class="page-wrap">
        <section id="dashboardPage" class="page"></section>
        <section id="ordersPage" class="page hidden"></section>
        <section id="templatesPage" class="page hidden"></section>
        <section id="staffPage" class="page hidden"></section>
        <section id="reportsPage" class="page hidden"></section>
        <section id="outsourcePage" class="page hidden"></section>
      </main>
    </div>
  </div>

  <div id="orderModal" class="modal hidden">
    <div class="modal-card large">
      <div class="modal-header">
        <h3>新規受注登録</h3>
        <button id="closeOrderModal" class="icon-btn">✕</button>
      </div>
      <div class="modal-body split-body">
        <div class="modal-pane">
          <div class="tabs">
            <button class="tab active" data-tab="manual">手入力</button>
            <button class="tab" data-tab="pdf">PDF / 発注書読込</button>
          </div>

          <div id="pdfTab" class="tab-pane hidden">
            <div class="upload-box">
              <div class="upload-title">発注書・仕様書を添付して自動入力</div>
              <div class="upload-row">
                <span id="pickedFileName" class="muted">ファイルを選択（PDF推奨）</span>
                <label class="btn btn-light">
                  ファイルを選択
                  <input id="pdfInput" type="file" accept=".pdf,.txt,.doc,.docx,.png,.jpg,.jpeg" hidden />
                </label>
              </div>
              <div id="pdfMsg" class="msg hidden"></div>
            </div>
          </div>

          <div id="manualTab" class="tab-pane">
            <div class="form-grid">
              <label><span>顧客名 *</span><input id="fClient" type="text"></label>
              <label><span>顧客メール</span><input id="fClientEmail" type="email"></label>
              <label><span>案件名 *</span><input id="fProjectName" type="text"></label>
              <label><span>優先度</span><select id="fPriority"><option>通常</option><option>高</option><option>特急</option></select></label>
              <label><span>テンプレート *</span><select id="fTemplate"></select></label>
              <label><span>受注金額</span><input id="fAmount" type="number"></label>
              <label><span>納品形式</span><input id="fDeliverable" type="text" value="AI / PSD / PNG"></label>
              <label><span>修正回数</span><input id="fRevisionCount" type="number" value="2"></label>
              <label class="span2"><span>発注詳細</span><textarea id="fDetails" rows="5"></textarea></label>
              <label><span>納期 *</span><input id="fDeadline" type="date"></label>
              <label><span>社内メモ</span><input id="fMemo" type="text"></label>
            </div>
          </div>
        </div>
        <div class="modal-pane side-preview">
          <div class="panel-title">AI判定プレビュー</div>
          <div id="previewEmpty" class="preview-empty">顧客名・案件名・テンプレが入るとプレビュー開始。納期を入れると確定精度が上がります。</div>
          <div id="previewBox" class="hidden">
            <div class="mini-grid">
              <div class="mini-card"><div class="mini-label">担当者</div><div id="pAssignee" class="mini-value"></div></div>
              <div class="mini-card"><div class="mini-label">想定工数</div><div id="pEstimate" class="mini-value"></div></div>
              <div class="mini-card"><div class="mini-label">判定</div><div id="pJudge" class="mini-value"></div></div>
              <div class="mini-card"><div class="mini-label">完了見込み</div><div id="pFinish" class="mini-value"></div></div>
            </div>
            <div class="notice-wrap">
              <div class="mini-label">通知文面</div>
              <div id="pNotice" class="notice-box"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <div id="submitHint" class="submit-hint">* 顧客名 / 案件名 / テンプレ / 納期 を入れると登録できます</div>
        <div class="footer-actions">
          <button id="cancelOrderBtn" class="btn btn-light">キャンセル</button>
          <button id="saveOrderBtn" class="btn btn-primary" disabled>受注登録</button>
        </div>
      </div>
    </div>
  </div>

  <div id="staffModal" class="modal hidden">
    <div class="modal-card small">
      <div class="modal-header">
        <h3 id="staffModalTitle">スタッフ追加</h3>
        <button id="closeStaffModal" class="icon-btn">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-grid single">
          <label><span>氏名</span><input id="sName" type="text"></label>
          <label><span>役職</span><input id="sRole" type="text"></label>
          <label><span>メール</span><input id="sEmail" type="email"></label>
          <label><span>1日稼働時間</span><input id="sHours" type="number" value="8"></label>
          <label><span>スキル（カンマ区切り）</span><input id="sSkills" type="text"></label>
        </div>
      </div>
      <div class="modal-footer"><div></div><div class="footer-actions"><button id="cancelStaffBtn" class="btn btn-light">キャンセル</button><button id="saveStaffBtn" class="btn btn-primary">保存</button></div></div>
    </div>
  </div>

  <div id="receiveModal" class="modal hidden">
    <div class="modal-card small">
      <div class="modal-header">
        <h3>外注完了案件を受信</h3>
        <button id="closeReceiveModal" class="icon-btn">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-grid single">
          <label><span>受注番号</span><input id="rId" type="text" placeholder="例: OD-1234"></label>
          <label><span>受信メモ</span><textarea id="rMemo" rows="4"></textarea></label>
        </div>
      </div>
      <div class="modal-footer"><div></div><div class="footer-actions"><button id="cancelReceiveBtn" class="btn btn-light">キャンセル</button><button id="saveReceiveBtn" class="btn btn-primary">受信登録</button></div></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
